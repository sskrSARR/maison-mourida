databases:
  - name: mourida-db
    plan: free
    databaseName: gestcmd
    user: gestcmd

services:
  - type: web
    name: maison-mourida
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /sante/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mourida-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TASK_TOKEN
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
